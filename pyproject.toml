[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-job-agent"
version = "0.8.4"
license = {file = "LICENSE"}
description = "NextRole: experience matching, application PDFs, and connected inbox delivery"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "sqlmodel>=0.0.27,<0.1", "APScheduler>=3.11,<4", "playwright>=1.58,<2", "beautifulsoup4>=4.13,<5", "httpx>=0.28,<1", "reportlab>=4.4,<5", "pypdf>=6,<7", "pypdfium2>=5.14,<6", "google-genai>=1.50,<3", "tzdata>=2025.2", "mcp>=1.25,<2", "fastapi>=0.120,<1", "uvicorn>=0.38,<1"]

[project.optional-dependencies]
cloud = ["sqlitecloud>=0.0.84,<0.1"]
test = ["pytest>=8,<10"]

[project.scripts]
campus-agent = "campus_agent.cli:main"

[tool.setuptools.packages.find]
include = ["campus_agent*"]

[tool.setuptools.package-data]
campus_agent = ["dashboard.html", "workspace.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
