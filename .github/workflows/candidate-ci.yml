name: NextRole Candidate Release CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/evidence-first-resume-cover-2026-10]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e '.[test]'
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Check inline browser JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html=pathlib.Path("campus_agent/workspace.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script[^>]*>(.*?)</script>",html,flags=re.I|re.S)
          assert scripts, "No browser scripts found"
          for i,script in enumerate(scripts):
              pathlib.Path(f"/tmp/nextrole-script-{i}.js").write_text(script,encoding="utf-8")
          print("Checking",len(scripts),"inline scripts")
          PY
          for script in /tmp/nextrole-script-*.js; do node --check "$script"; done
      - name: Build audited clean Mac ZIP
        run: python scripts/build_release.py
      - name: Verify release metadata and contents
        id: package
        run: |
          python - <<'PY'
          import json, os, pathlib, re, tomllib, zipfile
          version=tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version)
          name=f"NextRole-Mac-{version}"
          with zipfile.ZipFile(pathlib.Path("dist") / (name + ".zip")) as archive:
              assert archive.testzip() is None
              paths=archive.namelist()
              assert any(p.endswith("/docs/ROLE-TAILORING.md") for p in paths)
              assert not any("/workspace/" in p for p in paths)
              manifest=json.loads(archive.read(f"{name}/RELEASE-MANIFEST.json"))
              assert manifest["version"]==version
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"name={name}", file=output)
          PY
      - name: Upload clean release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-Candidate
          path: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/${{ steps.package.outputs.name }}.zip.sha256
            dist/${{ steps.package.outputs.name }}.manifest.json
          if-no-files-found: error
