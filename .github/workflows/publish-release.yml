name: Publish NextRole

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install and run tests
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e '.[test]'
          python -m pytest -q
      - name: Check inline browser JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html=pathlib.Path("campus_agent/workspace.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script[^>]*>(.*?)</script>",html,flags=re.I|re.S)
          assert scripts, "No browser scripts found"
          for i,script in enumerate(scripts):
              pathlib.Path(f"/tmp/nextrole-script-{i}.js").write_text(script,encoding="utf-8")
          print("Checking",len(scripts),"inline scripts")
          PY
          for script in /tmp/nextrole-script-*.js; do node --check "$script"; done
      - name: Build clean source distribution
        run: python scripts/build_release.py
      - name: Inspect release contents
        id: package
        run: |
          python - <<'PY'
          import json, os, pathlib, re, tomllib, zipfile
          version=tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version)
          name=f"NextRole-Mac-{version}"
          z=pathlib.Path("dist")/(name+".zip")
          assert z.exists()
          with zipfile.ZipFile(z) as archive:
              assert archive.testzip() is None
              files=archive.namelist()
              assert any(x.endswith("/docs/ROLE-TAILORING.md") for x in files)
              assert not any("/workspace/" in x or "/artifacts/" in x for x in files)
              m=json.loads(archive.read(name+"/RELEASE-MANIFEST.json"))
              assert m["version"]==version
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"name={name}", file=output)
              print(f"version={version}", file=output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-Verified
          path: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/${{ steps.package.outputs.name }}.zip.sha256
            dist/${{ steps.package.outputs.name }}.manifest.json
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify-release.outputs.package }}-Verified
          path: dist
      - name: Release verified Mac package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
          RELEASE_PACKAGE: ${{ needs.verify-release.outputs.package }}
        run: |
          set -euo pipefail
          if gh release view "v$RELEASE_VERSION" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release v$RELEASE_VERSION already exists; refusing to overwrite artifacts."
          else
            gh release create "v$RELEASE_VERSION" \
              "dist/$RELEASE_PACKAGE.zip" \
              "dist/$RELEASE_PACKAGE.zip.sha256" \
              "dist/$RELEASE_PACKAGE.manifest.json" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "NextRole Mac $RELEASE_VERSION" \
              --notes "Verified Mac source package. See CHANGELOG.md for the changes in this version."
          fi
