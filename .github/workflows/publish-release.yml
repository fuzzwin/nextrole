name: Publish NextRole 0.9.13

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install and run tests
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e '.[test]'
          python -m pytest -q
      - name: Check inline browser JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html=pathlib.Path("campus_agent/workspace.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script[^>]*>(.*?)</script>",html,flags=re.I|re.S)
          assert scripts, "No browser scripts found"
          for i,script in enumerate(scripts):
              pathlib.Path(f"/tmp/nextrole-script-{i}.js").write_text(script,encoding="utf-8")
          print("Checking",len(scripts),"inline scripts")
          PY
          for script in /tmp/nextrole-script-*.js; do node --check "$script"; done
      - name: Build clean source distribution
        run: python scripts/build_release.py
      - name: Inspect release contents
        run: |
          python - <<'PY'
          import json, pathlib, zipfile
          name="NextRole-Mac-0.9.13"
          z=pathlib.Path("dist")/(name+".zip")
          assert z.exists()
          with zipfile.ZipFile(z) as archive:
              assert archive.testzip() is None
              files=archive.namelist()
              assert any(x.endswith("/docs/ROLE-TAILORING.md") for x in files)
              assert not any("/workspace/" in x or "/artifacts/" in x for x in files)
              m=json.loads(archive.read(name+"/RELEASE-MANIFEST.json"))
              assert m["version"]=="0.9.13"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NextRole-Mac-0.9.13-Verified
          path: |
            dist/NextRole-Mac-0.9.13.zip
            dist/NextRole-Mac-0.9.13.zip.sha256
            dist/NextRole-Mac-0.9.13.manifest.json
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NextRole-Mac-0.9.13-Verified
          path: dist
      - name: Release verified Mac package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.9.13 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release v0.9.13 already exists; refusing to overwrite artifacts."
          else
            gh release create v0.9.13 \
              dist/NextRole-Mac-0.9.13.zip \
              dist/NextRole-Mac-0.9.13.zip.sha256 \
              dist/NextRole-Mac-0.9.13.manifest.json \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "NextRole Mac 0.9.13" \
              --notes "Australian custom job-title searches, grounded cover letters, licence and registration records, and cross-industry work evidence. Custom roles use manual packet review."
          fi
